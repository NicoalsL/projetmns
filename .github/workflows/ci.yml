name: Verification du projet
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    # Version d'Ubuntu fixée (et non ubuntu-latest, qui change de version sans
    # prévenir) : la CI reste reproductible, notamment avant l'examen.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduquizai_test
          POSTGRES_PASSWORD: mot_de_passe_ci_uniquement
          POSTGRES_DB: eduquizai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduquizai_test -d eduquizai_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      # Moindre privilège, comme en production : db:init utilise le compte
      # propriétaire et crée le compte restreint, que l'API utilise ensuite.
      DATABASE_URL_ADMIN: postgresql://eduquizai_test:mot_de_passe_ci_uniquement@localhost:5432/eduquizai_test
      DATABASE_URL: postgresql://eduquizai_app:mot_de_passe_app_ci_uniquement@localhost:5432/eduquizai_test
      # Secret de test éphémère, exclusivement pour ce job isolé.
      JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PORT: '3000'
      # Aucun appel payant à OpenAI dans la CI.
      IA_FOURNISSEUR: simulation
    steps:
      # Actions officielles en v7 (Node 24) : les v4 visaient Node 20, abandonné par GitHub.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            eduquizai/back/package-lock.json
            eduquizai/front/package-lock.json
      - run: npm ci
        working-directory: eduquizai/back
      # Qualité du code : oxlint (analyse statique), aucun avertissement toléré.
      - run: npm run lint
        working-directory: eduquizai/back
      - name: Auditer les dépendances backend
        run: npm audit --audit-level=high
        working-directory: eduquizai/back
      # Tests Jest + mesure de couverture : échec si elle passe sous les seuils
      # fixés dans package.json (80 % des lignes).
      - run: npm run test:couverture
        working-directory: eduquizai/back
      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture-back
          path: eduquizai/back/coverage/
      - run: npm run db:init
        working-directory: eduquizai/back
      - name: Demarrer API de test
        working-directory: eduquizai/back
        run: |
          node src/serveur.js > /tmp/eduquizai-api.log 2>&1 &
          for tentative in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/pret; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduquizai-api.log
          exit 1
      - run: npm run test:reel
        working-directory: eduquizai/back
      - run: npm run test:reel:quiz
        working-directory: eduquizai/back
      # Collection Postman (outil de test recommandé par le CDC) exécutée par
      # Newman sur l'API démarrée : parcours enseignant et contrôles de sécurité.
      - run: npm run test:postman
        working-directory: eduquizai/back
      # Scan de sécurité OWASP ZAP (passif) sur l'API démarrée : en-têtes,
      # divulgation d'informations, mauvaises configurations. -I : les
      # avertissements ne bloquent pas le pipeline ; le rapport est conservé.
      - name: Scan OWASP ZAP de l'API
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000/sante -I -r rapport-zap.html
      - name: Conserver le rapport ZAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-zap
          path: zap/rapport-zap.html
      - run: npm ci
        working-directory: eduquizai/front
      - run: npm test
        working-directory: eduquizai/front
      - run: npm run lint
        working-directory: eduquizai/front
      - name: Auditer les dépendances frontend
        run: npm audit --audit-level=high
        working-directory: eduquizai/front
      - run: npm run build
        working-directory: eduquizai/front
      - run: docker build -t eduquizai-back-ci ./eduquizai/back
      - run: docker build -t eduquizai-front-ci ./eduquizai/front
      # Image de production du front (build Vite + nginx, voir documentation/exploitation/deploiement.md).
      - run: docker build -f ./eduquizai/front/Dockerfile.prod -t eduquizai-front-prod-ci ./eduquizai/front

  # Livraison continue (CD) : seulement sur la branche main, et seulement si
  # toutes les vérifications ci-dessus ont réussi. Les images de production
  # sont publiées sur le registre GitHub (ghcr.io), prêtes à être déployées
  # par scripts/deployer.sh ; il n'y a pas encore de serveur cible.
  livraison:
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Publier les images de production sur ghcr.io
        env:
          JETON_REGISTRE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Le registre exige un nom en minuscules.
          proprietaire=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          registre="ghcr.io/$proprietaire"
          version="${GITHUB_SHA::12}"
          echo "$JETON_REGISTRE" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$registre/eduquizai-back:$version" -t "$registre/eduquizai-back:latest" ./eduquizai/back
          docker build -f ./eduquizai/front/Dockerfile.prod \
            -t "$registre/eduquizai-front:$version" -t "$registre/eduquizai-front:latest" ./eduquizai/front
          for image in eduquizai-back eduquizai-front; do
            docker push "$registre/$image:$version"
            docker push "$registre/$image:latest"
          done
