name: Verification du projet
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    # Version d'Ubuntu fixée (et non ubuntu-latest, qui change de version sans
    # prévenir) : la CI reste reproductible, notamment avant l'examen.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduquizai_test
          POSTGRES_PASSWORD: mot_de_passe_ci_uniquement
          POSTGRES_DB: eduquizai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduquizai_test -d eduquizai_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      # MongoDB éphémère pour les quiz, détruit à la fin du job.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      DATABASE_URL: postgresql://eduquizai_test:mot_de_passe_ci_uniquement@localhost:5432/eduquizai_test
      # Secret de test éphémère, exclusivement pour ce job isolé.
      JWT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PORT: '3000'
      MONGO_URL: mongodb://localhost:27017/eduquizai_test
      # Aucun appel payant à OpenAI dans la CI.
      IA_FOURNISSEUR: simulation
    steps:
      # Actions officielles en v7 (Node 24) : les v4 visaient Node 20, abandonné par GitHub.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            eduquizai/back/package-lock.json
            eduquizai/front/package-lock.json
      - run: npm ci
        working-directory: eduquizai/back
      - run: npm test
        working-directory: eduquizai/back
      - run: npm run db:init
        working-directory: eduquizai/back
      - name: Demarrer API de test
        working-directory: eduquizai/back
        run: |
          node src/serveur.js > /tmp/eduquizai-api.log 2>&1 &
          for tentative in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/pret; then exit 0; fi
            sleep 1
          done
          cat /tmp/eduquizai-api.log
          exit 1
      - run: npm run test:reel
        working-directory: eduquizai/back
      - run: npm run test:reel:quiz
        working-directory: eduquizai/back
      # Scan de sécurité OWASP ZAP (passif) sur l'API démarrée : en-têtes,
      # divulgation d'informations, mauvaises configurations. -I : les
      # avertissements ne bloquent pas le pipeline ; le rapport est conservé.
      - name: Scan OWASP ZAP de l'API
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000/sante -I -r rapport-zap.html
      - name: Conserver le rapport ZAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-zap
          path: zap/rapport-zap.html
      - run: npm ci
        working-directory: eduquizai/front
      - run: npm test
        working-directory: eduquizai/front
      - run: npm run lint
        working-directory: eduquizai/front
      - run: npm run build
        working-directory: eduquizai/front
      - run: docker build -t eduquizai-back-ci ./eduquizai/back
      - run: docker build -t eduquizai-front-ci ./eduquizai/front
      # Image de production du front (build Vite + nginx, voir docs/deploiement.md).
      - run: docker build -f ./eduquizai/front/Dockerfile.prod -t eduquizai-front-prod-ci ./eduquizai/front
