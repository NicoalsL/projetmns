# Configuration nginx de production (front/Dockerfile.prod).
# Rôles : servir l'application React construite, transmettre /api/ au back,
# et ajouter les en-têtes de sécurité à toutes les réponses.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Ne pas annoncer la version de nginx (même principe que x-powered-by côté Express).
    server_tokens off;

    # --- En-têtes de sécurité -------------------------------------------------
    # CSP : le navigateur ne charge que des ressources du site lui-même. Une
    # injection de script (XSS) ne pourrait ni exécuter un script externe, ni
    # envoyer de données ailleurs (connect-src). img-src accepte data: pour les
    # icônes CSS de la charte ; les images externes d'un cours sont bloquées
    # (pas de pixel de suivi).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Pas d'affichage dans une iframe d'un autre site (clickjacking).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Isolation entre origines (alerte OWASP ZAP 90004) : tout le site est servi
    # par une seule origine, aucune ressource tierce n'est donc bloquée par ces règles.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Compression : textes 3 à 4 fois plus légers sur le réseau (éco-conception).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API ------------------------------------------------------------------
    # Le back n'est pas exposé à l'extérieur : nginx est le seul point d'entrée.
    location /api/ {
        proxy_pass http://back:3000;
        proxy_set_header Host $host;
        # Adresse réelle du client, lue par Express (TRUST_PROXY=1) pour la
        # limitation des tentatives de connexion.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un cours fait au plus 512 ko (limite du back) : on refuse plus gros ici.
        client_max_body_size 1m;
        # Une génération par IA locale peut durer jusqu'à 2 minutes.
        proxy_read_timeout 150s;
    }

    # --- Fichiers de l'application ---------------------------------------------
    # Fichiers produits par Vite : leur nom contient une empreinte qui change à
    # chaque version, ils peuvent donc être gardés en cache un an.
    location /assets/ {
        expires 1y;
    }

    location /fonts/ {
        expires 30d;
    }

    # Application React (une seule page) : toute adresse inconnue, comme
    # /cours/12, renvoie index.html et c'est React Router qui affiche la page.
    location / {
        try_files $uri /index.html;
    }
}
