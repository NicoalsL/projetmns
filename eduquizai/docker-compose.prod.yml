# Configuration proche de la PRODUCTION (procédure : documentation/exploitation/deploiement.md).
# Différences avec docker-compose.yml (développement) :
# - front construit (vite build) et servi par nginx, seul port exposé ;
# - API lancée sans rechargement automatique, joignable uniquement via nginx ;
# - seule la base PostgreSQL, non exposée ;
# - moindre privilège : l'API utilise un compte PostgreSQL restreint ;
# - secrets lus dans .env.production (jamais commité), redémarrage automatique.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --wait

name: eduquizai-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduquizai
      POSTGRES_PASSWORD: ${POSTGRES_MOT_DE_PASSE:?POSTGRES_MOT_DE_PASSE requis dans .env.production}
      POSTGRES_DB: eduquizai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduquizai -d eduquizai"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Variables communes à l'initialisation SQL et à l'API (ancre YAML).
  db-init:
    build: ./back
    command: ["npm", "run", "db:init"]
    environment:
      <<: &environnement-back
        NODE_ENV: production
        # Mots de passe en hexadécimal (voir .env.production.example) : ils
        # s'insèrent dans ces URL sans caractère à échapper.
        # SÉCURITÉ — Comptes RESTREINTS de l'API (moindre privilège).
        DATABASE_URL: >-
          postgresql://eduquizai_app:${POSTGRES_APP_MOT_DE_PASSE:?requis}@postgres:5432/eduquizai
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis dans .env.production}
        IA_FOURNISSEUR: ${IA_FOURNISSEUR:-simulation}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        OPENAI_MODELE: ${OPENAI_MODELE:-}
        OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
        OLLAMA_MODELE: ${OLLAMA_MODELE:-qwen3:4b}
        OLLAMA_CONSERVATION: ${OLLAMA_CONSERVATION:-30m}
        ORIGINE_FRONT: ${ORIGINE_FRONT:-http://localhost:8080}
        # Un proxy de confiance devant l'API : le nginx du service front.
        TRUST_PROXY: "1"
      # Compte propriétaire : seulement pour créer les tables et le compte de l'API.
      DATABASE_URL_ADMIN: postgresql://eduquizai:${POSTGRES_MOT_DE_PASSE}@postgres:5432/eduquizai
    depends_on:
      postgres:
        condition: service_healthy

  back:
    build: ./back
    restart: unless-stopped
    environment: *environnement-back
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Aucun port publié : l'API n'est joignable que par nginx, sur le réseau Docker.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/pret').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      db-init:
        condition: service_completed_successfully

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${PORT_PUBLIC:-8080}:8080"
    depends_on:
      back:
        condition: service_healthy

volumes:
  postgres_data:
