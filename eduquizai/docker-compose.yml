# Environnement de développement local, pas une configuration de production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduquizai
      POSTGRES_PASSWORD: eduquizai
      POSTGRES_DB: eduquizai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduquizai -d eduquizai"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  db-init:
    build: ./back
    env_file: ./back/.env
    command: ["npm", "run", "db:init"]
    depends_on:
      postgres:
        condition: service_healthy

  back:
    build: ./back
    env_file: ./back/.env
    ports:
      - "127.0.0.1:3000:3000"
    command: ["node", "--watch", "src/serveur.js"]
    volumes:
      - ./back/src:/app/src:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/pret').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  front:
    build: ./front
    environment:
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./front/src:/app/src:ro
    depends_on:
      back:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
